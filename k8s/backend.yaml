# Quarkus Application Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: appserver
    spec:
      containers:
        - name: backend
          image: ghcr.io/elyanuki/camconnect-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_URL
              value: http://localhost:4200
            - name: EMAIL_PASSWORD
              value: hHl49vc2dLvmJU27EfRY
          startupProbe:
            httpGet:
              path: /api/q/health
              port: 8080
            timeoutSeconds: 5
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/q/health
              port: 8080
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 120
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: backend
