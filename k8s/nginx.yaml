# nginx Web Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: ghcr.io/elyanuki/camconnect-web:latest
          # remove imagePullPolicy when stable. Currently we do not take care of version numbers
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: nginx

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leoc loud-nginx-demo-root
  namespace: student-it200271
  resourceVersion: "26933166"
  uid: 283d34e3-4872-46e1-9252-4932663b2461
spec:
  ingressClassName: nginx
  rules:
    - host: it200271.cloud.htl-leonding.ac.at
      http:
        paths:
          - backend:
              service:
                name: nginx
                port:
                  number: 80
            path: /
            pathType: Prefix